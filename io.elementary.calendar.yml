id: io.elementary.calendar
runtime: io.elementary.Platform
runtime-version: '9'
sdk: io.elementary.Sdk
command: io.elementary.calendar
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

  # EDS DBus interfaces
  - --talk-name=org.gnome.evolution.dataserver.AddressBook10
  - --talk-name=org.gnome.evolution.dataserver.Calendar8
  - --talk-name=org.gnome.evolution.dataserver.Sources5
  - --talk-name=org.gnome.evolution.dataserver.Subprocess.Backend.*

  - --talk-name=org.freedesktop.Notifications
  - --system-talk-name=org.freedesktop.GeoClue2
  - --system-talk-name=org.freedesktop.login1

  - --metadata=X-DConf=migrate-path=/io/elementary/calendar/
cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/girepository-1.0
  - /share/gir-1.0
  - /share/vala
  - '*.a'
  - '*.la'
build-options:
  libdir: /app/lib
modules:
  - name: libical
    buildsystem: cmake-ninja
    cleanup:
      - /lib/cmake
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DCMAKE_INSTALL_LIBDIR=/app/lib
      - -DBUILD_SHARED_LIBS=ON
      - -DICAL_GLIB=true
      - -DICAL_GLIB_VAPI=true
      - -DGOBJECT_INTROSPECTION=true
      - -DICAL_BUILD_DOCS=false
      - -DWITH_CXX_BINDINGS=false
      - -DSHARED_ONLY=true
      - -DLIBICAL_BUILD_TESTING=false
    sources:
      - type: git
        url: https://github.com/libical/libical.git
        tag: v3.0.20

  - name: evolution-data-server
    buildsystem: cmake-ninja
    cleanup:
      - /lib/evolution-data-server/*-backends
      - /libexec
      - /share/dbus-1/services
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DENABLE_GTK=ON
      - -DENABLE_CANBERRA=OFF
      - -DENABLE_GOA=OFF
      - -DENABLE_GOOGLE=ON
      - -DENABLE_VALA_BINDINGS=ON
      - -DENABLE_INTROSPECTION=ON
      - -DENABLE_GOA=OFF
      - -DENABLE_CANBERRA=OFF
      - -DWITH_LIBDB=OFF
      - -DENABLE_WEATHER=OFF
      - -DWITH_OPENLDAP=OFF
      - -DENABLE_INSTALLED_TESTS=OFF
      - -DENABLE_TESTS=OFF
      - -DENABLE_GTK_DOC=OFF
      - -DENABLE_EXAMPLES=OFF
    sources:
      - type: archive
        url: https://download.gnome.org/sources/evolution-data-server/3.61/evolution-data-server-3.61.3.tar.xz
        sha256: 1cb9c9b6a12fa53473f5c0332ac39fff32586fb22a932a26aa973c260bb13a83
        x-checker-data:
          type: gnome
          name: evolution-data-server
    modules:
      - name: intltool
        cleanup:
          - '*'
        sources:
          - type: archive
            url: https://launchpad.net/intltool/trunk/0.51.0/+download/intltool-0.51.0.tar.gz
            md5: 12e517cac2b57a0121cda351570f1e63

  - name: libshumate
    buildsystem: meson
    config-opts:
      - -Dgtk_doc=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libshumate/1.6/libshumate-1.6.3.tar.xz
        sha256: fd15c91396dcd82fce3021648541aa891e71a6bddeffc03d38597580a7da8ca1
        x-checker-data:
          type: gnome
          name: libshumate
    modules:
      - name: protobuf-c
        buildsystem: autotools
        config-opts:
          - --disable-protoc
        sources:
          - type: git
            url: https://github.com/protobuf-c/protobuf-c.git
            tag: v1.5.2
            commit: 4719fdd7760624388c2c5b9d6759eb6a47490626
            x-checker-data:
              type: git
              tag-pattern: ^v([\d.]+)$

  - name: folks
    buildsystem: meson
    config-opts:
      - -Dbluez_backend=false
      - -Dofono_backend=false
      - -Dtelepathy_backend=false
      - -Dimport_tool=false
      - -Dinspect_tool=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/folks/0.15/folks-0.15.12.tar.xz
        sha256: 21f44e2bdabb1ee7f8e41bb996d10ac7daf35c78c498177db0c00f580a20a914
        x-checker-data:
          type: gnome
          name: folks

  - name: geocode-glib
    buildsystem: meson
    config-opts:
      - -Denable-installed-tests=false
      - -Denable-gtk-doc=false
      - -Dsoup2=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/geocode-glib/3.26/geocode-glib-3.26.4.tar.xz
        sha256: 2d9a6826d158470449a173871221596da0f83ebdcff98b90c7049089056a37aa
        x-checker-data:
          type: gnome
          name: geocode-glib

  - name: calendar
    buildsystem: meson
    sources:
      - type: dir
        path: .
